name: Deploy to VPS

# Mirrors the acca-cbt deploy flow, adapted for a Python/Flask app.
# On push to main, GitHub Actions SSHes into the VPS, pulls the code, and
# refreshes the virtualenv. aaPanel's Python Project Manager runs/restarts gunicorn.

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Pull code & install deps on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        command_timeout: 20m
        timeout: 20m
        script: |
          set -e
          APP_DIR="/www/wwwroot/acca-tools"

          echo "Pulling latest code..."
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          echo "Ensuring virtualenv exists..."
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi

          echo "Installing dependencies..."
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements-core.txt -r requirements-prod.txt
          # Optional packages may need system libs; never fail the deploy on them.
          ./.venv/bin/pip install -r requirements-optional.txt || true

          echo "Deps ready. Restart gunicorn from aaPanel Python Project Manager."
